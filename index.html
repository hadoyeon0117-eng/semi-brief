<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="반도체 시황 · 세계 시장 · 국내 증시 · SK하이닉스 데일리 브리핑">
<title>반도체 데일리 브리핑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 단일 컬럼 읽기 지면. 상단 날짜 띠 + 시장 숫자 띠 + 섹션 카드 + 댓글. 용어는 본문 안에 점선 밑줄로 심어 두고 탭하면 뜻 팝오버. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#161a22; --muted:#6b7280; --line:#e2e5ea;
  --accent:#1d4ed8; --accent-soft:#e8eefc; --up:#d2342b; --down:#2563eb; --term:#1d4ed8;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1218; --surface:#171b23; --fg:#e8eaef; --muted:#9aa1ad; --line:#2a303b;
  --accent:#6b93ff; --accent-soft:#1c2740; --up:#ff6b61; --down:#6b93ff; --term:#8fb0ff; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1218; --surface:#171b23; --fg:#e8eaef; --muted:#9aa1ad; --line:#2a303b;
  --accent:#6b93ff; --accent-soft:#1c2740; --up:#ff6b61; --down:#6b93ff; --term:#8fb0ff; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.6;font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance;line-height:1.25}
.lede{color:var(--muted);margin:0;font-size:14px}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:14px 0 4px;scrollbar-width:thin}
.dates button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.dates button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ticker{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0 22px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tk .n{font-size:12px;color:var(--muted)}
.tk .v{font-family:var(--font-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.tk .c{font-size:12px;font-variant-numeric:tabular-nums}
.c.up{color:var(--up)} .c.down{color:var(--down)}
.summary{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:22px;font-size:15px}
section.block{margin-bottom:26px}
.block h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.block h2 .tag{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;min-width:0}
.item h3{font-size:15px;margin:0 0 6px;line-height:1.4;text-wrap:balance}
.item p{margin:0;color:var(--fg)}
.item .src{display:block;margin-top:8px;font-size:12px;color:var(--muted);text-decoration:none}
.item .src:hover{color:var(--accent)}
.term{color:var(--term);border-bottom:1.5px dotted var(--term);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;font:inherit;padding:0;line-height:inherit}
.term:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pop{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:13.5px;line-height:1.55}
#pop b{display:block;font-size:14px;margin-bottom:4px;color:var(--accent)}
#pop .x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}
.glossary{margin-top:8px;font-size:13px;color:var(--muted)}
.glossary summary{cursor:pointer}
.glossary dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.glossary dt{font-weight:600;color:var(--fg)} .glossary dd{margin:0}
.member{display:grid;grid-template-columns:40px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;min-width:0}
.member .av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.member .nm{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.member .rl{font-size:12px;color:var(--muted);font-weight:400}
.member .st{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.st.buy{color:var(--up);border-color:var(--up)} .st.sell{color:var(--down);border-color:var(--down)} .st.hold{color:var(--muted)}
.member p{margin:4px 0 0;font-size:14px}
.verdict{border:2px solid var(--fg);border-radius:12px;padding:14px 16px;margin-top:12px}
.verdict .eyebrow{margin-bottom:4px}
.verdict .res{font-size:20px;font-weight:700;margin:0 0 6px}
.verdict .tally{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.verdict .tally span{font-family:var(--font-mono);font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft)}
.verdict p{margin:6px 0 0;font-size:14px}
.quiz{counter-reset:q}
.qz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.qz .qt{font-weight:600;margin:0 0 8px}
.qz .qt::before{counter-increment:q;content:"Q" counter(q) ". ";color:var(--accent)}
.qz .opts{display:flex;flex-direction:column;gap:6px}
.qz .opts button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.qz .opts button:focus-visible{outline:2px solid var(--accent)}
.qz.done .opts button{cursor:default}
.qz .opts button.right{border-color:var(--up);background:color-mix(in srgb,var(--up) 10%,var(--surface))}
.qz .opts button.wrong{border-color:var(--down);opacity:.7}
.qz .ex{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.qz .ex[hidden]{display:none}
.score{font-size:14px;color:var(--muted);margin-top:4px}
.comments{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
.comments h2{font-size:17px;margin:0 0 4px}
.comments .hint{font-size:13px;color:var(--muted);margin:0 0 14px}
.composer{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.composer textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--fg)}
.composer .row{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.composer .note{font-size:12px;color:var(--muted);margin-right:auto}
.btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.thread{display:flex;flex-direction:column;gap:12px}
.cmt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cmt .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-bottom:4px}
.cmt .q{white-space:pre-wrap;word-break:break-word}
.reply{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);white-space:pre-wrap;word-break:break-word;font-size:14px}
.reply .who{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--accent);display:block;margin-bottom:4px}
.reply.pending{color:var(--muted);font-style:italic}
.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.disclaimer{margin-top:30px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ #pop{animation:pop .12s ease-out} @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1}} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Semiconductor · Markets · SK hynix</div>
    <h1 id="title">반도체 데일리 브리핑</h1>
    <p class="lede" id="lede">반도체 시황 · 세계 시장 · 주식 뉴스 · 하이닉스를 매일 아침 한 페이지로. 파란 점선 단어를 누르면 뜻이 나옵니다.</p>
  </header>
  <nav class="dates" id="dates" aria-label="날짜 선택"></nav>
  <main id="main"><div class="empty">브리핑을 불러오는 중입니다. 첫 브리핑은 매일 아침 자동으로 추가됩니다.</div></main>

  <section class="comments" id="comments">
    <h2>질문 · 댓글</h2>
    <p class="hint">이 정적 배포판에서는 AI 질문·답변이 지원되지 않습니다. 질문 기능은 claude.ai에서 연 원본 페이지에서 사용할 수 있습니다.</p>
  </section>
  <p class="disclaimer">뉴스를 요약·정리한 참고 자료이며 투자 권유가 아닙니다. 최종 판단과 책임은 본인에게 있습니다.</p>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const BASE_TERMS={
 "HBM":"고대역폭메모리(High Bandwidth Memory). D램을 여러 층으로 쌓아 데이터 통로를 넓힌 메모리로, 엔비디아 등 AI 가속기(GPU)에 붙어 쓰입니다. SK하이닉스가 시장 1위입니다.",
 "HBM4":"6세대 HBM. 2026년부터 엔비디아 차세대 가속기(루빈)에 탑재되기 시작하는 최신 제품으로, 이전 세대보다 단가가 높습니다.",
 "HBM3E":"5세대 HBM. 현재 엔비디아 블랙웰 등 주력 AI 칩에 주로 들어가는 제품입니다.",
 "D램":"컴퓨터·스마트폰·서버가 작업 중인 데이터를 잠시 올려두는 메모리. 전원이 꺼지면 내용이 사라집니다. 삼성전자·SK하이닉스·마이크론이 세계 시장을 나눠 갖습니다.",
 "범용 D램":"HBM처럼 특수하게 쌓지 않은 일반 D램(DDR5 등). PC·서버·스마트폰에 널리 쓰여 '범용'이라 부릅니다.",
 "낸드":"낸드플래시. 전원이 꺼져도 데이터가 남는 저장용 메모리로 SSD·스마트폰 저장공간에 쓰입니다.",
 "메모리 슈퍼사이클":"메모리 가격과 수요가 동시에 오래 오르는 대호황 국면을 가리키는 말입니다.",
 "영업이익":"매출에서 원가와 판매·관리비를 뺀, 본업으로 번 이익입니다.",
 "영업이익률":"영업이익을 매출로 나눈 비율. 80%면 100원 팔아 80원이 본업 이익이라는 뜻으로, 제조업에선 매우 드문 수치입니다.",
 "주주환원":"회사가 번 돈을 배당이나 자사주 매입·소각으로 주주에게 돌려주는 것입니다.",
 "특별배당":"정기 배당과 별도로 회사가 일회성으로 추가 지급하는 배당입니다.",
 "자사주 소각":"회사가 자기 주식을 사들여 없애는 것. 전체 주식 수가 줄어 남은 주식 한 주의 가치가 올라갑니다.",
 "매수 사이드카":"코스피200 선물이 급등하면 프로그램 매수 주문을 5분간 멈추는 안전장치. 급락 때는 '매도 사이드카'가 발동됩니다.",
 "외국인 순매수":"외국인 투자자가 판 금액보다 산 금액이 더 많은 상태. 국내 증시 방향을 좌우하는 큰 수급 요인입니다.",
 "필라델피아 반도체지수":"미국 주요 반도체 기업 30개로 만든 지수(SOX). 세계 반도체 주가 흐름의 대표 지표입니다.",
 "FOMC":"미국 연방준비제도(연준)의 금리 결정 회의. 연 8회 열리며 금리 방향이 세계 증시에 큰 영향을 줍니다.",
 "PCE 물가":"미국 개인소비지출 물가지수. 연준이 가장 중시하는 물가 지표입니다.",
 "10년물 금리":"미국 10년 만기 국채 수익률. 세계 자금의 기준 금리 역할을 하며, 오르면 주식(특히 성장주)에 부담입니다.",
 "하이일드 스프레드":"신용등급이 낮은 회사채 금리와 국채 금리의 차이. 벌어지면 시장이 위험을 더 경계한다는 신호입니다.",
 "레버리지 ETF":"기초지수 하루 등락의 2배(또는 그 이상)로 움직이도록 설계된 상장지수펀드. 손익이 모두 커집니다.",
 "인버스 ETF":"기초지수가 내리면 오르도록 설계된 상장지수펀드. 하락에 베팅할 때 씁니다.",
 "소부장":"소재·부품·장비의 줄임말. 반도체를 만드는 데 들어가는 재료와 기계를 공급하는 기업들입니다.",
 "네오클라우드":"코어위브처럼 GPU 서버를 빌려주는 신생 AI 전용 클라우드 업체들입니다.",
 "AI 거품론":"AI 투자가 실제 수익보다 과도하게 부풀려졌다는 주장. 빅테크의 막대한 설비투자가 회수될지가 쟁점입니다.",
 "IPO":"기업공개. 회사가 처음으로 주식을 증시에 상장해 일반 투자자에게 파는 것입니다.",
 "GDP":"국내총생산. 한 나라가 일정 기간 만든 재화·서비스의 총액으로, 경제 성장률의 기준입니다.",
 "ASP":"평균판매단가(Average Selling Price). 제품 한 개를 평균 얼마에 팔았는지를 뜻합니다.",
 "계약가격":"메모리 제조사가 대형 고객과 분기 단위로 정하는 공급 가격. 수시로 변하는 현물가격과 구분됩니다.",
 "피크아웃":"실적이나 주가가 정점을 찍고 꺾이는 것. '고점론'과 같은 뜻으로 쓰입니다.",
 "베이스다이":"HBM 맨 아래 깔리는 칩. 쌓인 D램을 제어하며, HBM4부터는 파운드리 첨단 공정으로 만듭니다.",
 "적층":"칩을 여러 층 쌓는 것. HBM 8단·12단은 D램을 8장·12장 쌓았다는 뜻입니다.",
 "키옥시아":"일본 낸드플래시 업체(옛 도시바 메모리). SK하이닉스가 지분을 일부 보유하고 있습니다.",
 "CXMT":"창신메모리. 중국의 D램 제조사로, 한국 메모리 업체의 잠재적 경쟁자로 거론됩니다.",
 "빅테크":"알파벳(구글)·메타·아마존·마이크로소프트 등 미국 대형 기술기업. AI 데이터센터 투자의 큰손입니다.",
 "데이터센터":"서버를 대량으로 모아둔 시설. AI 학습·서비스에 필요한 GPU와 메모리가 여기에 들어갑니다.",
 "목표지수":"증권사·투자은행이 일정 기간 뒤 지수가 도달할 것으로 보는 전망치입니다."
};

let db=null,user=null,sample=null,uid=null,canWrite=true;
let briefs=[],current=null,unsubC=null,terms=BASE_TERMS;

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function linkTerms(text){
  let out=esc(text);const keys=Object.keys(terms).sort((a,b)=>b.length-a.length);
  const seen=new Set();
  for(const k of keys){
    const re=new RegExp('(^|[^\\w가-힣])('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\w가-힣])');
    if(seen.has(k))continue;
    if(re.test(out)){out=out.replace(re,(m,p,t)=>p+'<button type="button" class="term" data-t="'+esc(k)+'">'+t+'</button>');seen.add(k);}
  }
  return out;
}
function fmtDate(d){const [y,m,dd]=d.split('-');return `${m}.${dd}`}
function fmtLong(d){const [y,m,dd]=d.split('-');const w=['일','월','화','수','목','금','토'][new Date(y,m-1,dd).getDay()];return `${y}년 ${+m}월 ${+dd}일 (${w})`}

function renderDates(){
  const n=$('#dates');n.innerHTML='';
  briefs.forEach(b=>{const btn=document.createElement('button');btn.textContent=fmtDate(b.date);btn.setAttribute('aria-current',current&&current.date===b.date?'true':'false');btn.onclick=()=>select(b.date);n.appendChild(btn)});
}
function renderBrief(){
  const m=$('#main');
  if(!current){m.innerHTML='<div class="empty">아직 브리핑이 없습니다. 매일 아침 자동으로 추가됩니다.</div>';return}
  terms=Object.assign({},BASE_TERMS,current.terms||{});
  let h='';
  h+=`<div class="eyebrow">${fmtLong(current.date)}</div>`;
  if(current.ticker&&current.ticker.length){h+='<div class="ticker">'+current.ticker.map(t=>{const up=String(t.chg||'').trim().startsWith('+');const dn=String(t.chg||'').trim().startsWith('-');return `<div class="tk"><div class="n">${esc(t.name)}</div><div class="v">${esc(t.value)}</div><div class="c ${up?'up':dn?'down':''}">${esc(t.chg||'')}</div></div>`}).join('')+'</div>'}
  if(current.summary)h+=`<div class="summary">${linkTerms(current.summary)}</div>`;
  (current.sections||[]).forEach(s=>{
    h+=`<section class="block"><h2>${esc(s.title)} <span class="tag">${esc(s.tag||'')}</span></h2>`;
    (s.items||[]).forEach(it=>{h+=`<article class="item"><h3>${linkTerms(it.head)}</h3><p>${linkTerms(it.body)}</p>${it.source?`<a class="src" href="${esc(it.source.url)}" target="_blank" rel="noopener">출처 · ${esc(it.source.name)} ↗</a>`:''}</article>`});
    h+='</section>';
  });
  const cm=current.committee;
  if(cm&&cm.members&&cm.members.length){
    h+=`<section class="block"><h2>가상 투자위원회 <span class="tag">9 VOICES</span></h2>`;
    cm.members.forEach(mb=>{const st=mb.stance||'';const cls=/매수|비중확대/.test(st)?'buy':/매도|축소|헤지/.test(st)?'sell':'hold';
      h+=`<article class="member"><div class="av">${esc((mb.name||'?').slice(0,1))}</div><div><div class="nm">${esc(mb.name)} <span class="rl">${esc(mb.role||'')}</span>${st?`<span class="st ${cls}">${esc(st)}</span>`:''}</div><p>${linkTerms(mb.view)}</p></div></article>`});
    if(cm.verdict){const v=cm.verdict;
      h+=`<div class="verdict"><div class="eyebrow">위원회 의결</div><p class="res">${esc(v.result||'')}</p>${v.tally?`<div class="tally">${Object.entries(v.tally).map(([k,n])=>`<span>${esc(k)} ${esc(n)}</span>`).join('')}</div>`:''}<p>${linkTerms(v.summary||'')}</p>${v.conditions?`<p><b>조건·점검 포인트:</b> ${linkTerms(v.conditions)}</p>`:''}</div>`}
    h+='</section>';
  }
  if(current.quiz&&current.quiz.length){
    h+=`<section class="block quiz" id="quiz"><h2>오늘의 복습 퀴즈 <span class="tag">${current.quiz.length} Q</span></h2>`;
    current.quiz.forEach((qz,i)=>{h+=`<article class="qz" data-i="${i}"><p class="qt">${esc(qz.q)}</p><div class="opts">${(qz.options||[]).map((o,j)=>`<button type="button" data-j="${j}">${esc(o)}</button>`).join('')}</div><p class="ex" hidden>${esc(qz.explain||'')}</p></article>`});
    h+=`<div class="score" id="score"></div></section>`;
  }
  h+=`<details class="glossary"><summary>오늘 나온 용어 모아보기</summary><dl id="gl"></dl></details>`;
  m.innerHTML=h;
  const dl=$('#gl');const names=[...new Set([...m.querySelectorAll('.term')].map(b=>b.dataset.t))];
  dl.innerHTML=names.map(k=>`<dt>${esc(k)}</dt><dd>${esc(terms[k])}</dd>`).join('')||'<dd>용어 없음</dd>';
}
function select(date){current=briefs.find(b=>b.date===date)||null;quizScore={right:0,done:0};renderDates();renderBrief();closePop();subscribeComments();}

/* 용어 팝오버 */
let pop=null;
function closePop(){if(pop){pop.remove();pop=null}}
document.addEventListener('click',e=>{
  const t=e.target.closest('.term');
  if(t){e.preventDefault();showPop(t);return}
  if(pop&&!e.target.closest('#pop'))closePop();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
/* 퀴즈 */
let quizScore={right:0,done:0};
document.addEventListener('click',e=>{
  const b=e.target.closest('.qz .opts button');if(!b)return;
  const art=b.closest('.qz');if(art.classList.contains('done'))return;
  const q=current.quiz[+art.dataset.i];const j=+b.dataset.j;
  art.classList.add('done');
  art.querySelectorAll('.opts button').forEach(x=>{if(+x.dataset.j===q.answer)x.classList.add('right');else if(x===b)x.classList.add('wrong');x.disabled=true});
  art.querySelector('.ex').hidden=false;
  quizScore.done++;if(j===q.answer)quizScore.right++;
  const s=$('#score');if(s)s.textContent=quizScore.done===current.quiz.length?`결과: ${current.quiz.length}문제 중 ${quizScore.right}개 정답`:`${quizScore.done}/${current.quiz.length} 풀었습니다`;
});
function showPop(btn){
  closePop();const k=btn.dataset.t;pop=document.createElement('div');pop.id='pop';pop.setAttribute('role','dialog');
  pop.innerHTML=`<button class="x" aria-label="닫기">×</button><b>${esc(k)}</b>${esc(terms[k]||'')}`;
  pop.querySelector('.x').onclick=closePop;document.body.appendChild(pop);
  const r=btn.getBoundingClientRect(),pw=pop.offsetWidth,ph=pop.offsetHeight;
  let left=Math.min(Math.max(16,r.left),window.innerWidth-pw-16);
  let top=r.bottom+8;if(top+ph>window.innerHeight-8)top=Math.max(8,r.top-ph-8);
  pop.style.left=left+'px';pop.style.top=top+'px';
}

/* 댓글 */
function subscribeComments(){
  return; const th=$('#thread');
  if(!db||!current){th.innerHTML='<div class="empty">댓글은 claude.ai에서 열었을 때 사용할 수 있습니다.</div>';return}
  const q=db.collection('comments').where('briefId','==',current.date).limit(200);
  unsubC=q.onSnapshot(snap=>{
    const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
    if(!docs.length){th.innerHTML='<div class="empty">아직 댓글이 없습니다. 첫 질문을 남겨 보세요.</div>';return}
    th.innerHTML=docs.map(c=>`<div class="cmt" data-id="${esc(c.id)}"><div class="meta"><span>${esc(c.author||'질문')}</span><span>${esc((c.createdAt||'').slice(0,16).replace('T',' '))}</span></div><div class="q">${esc(c.text)}</div>${c.reply?`<div class="reply"><span class="who">AI 답변</span>${esc(c.reply)}</div>`:c.replyStatus==='pending'?`<div class="reply pending">AI가 답변을 준비 중입니다…</div>`:c.replyStatus==='failed'?`<div class="reply pending">답변을 만들지 못했습니다. 다시 질문해 주세요.</div>`:''}</div>`).join('');
  },err=>{th.innerHTML='<div class="empty">댓글을 불러오지 못했습니다.</div>'});
}
function briefAsText(){
  if(!current)return'';let t=`[${current.date} 브리핑]\n${current.summary||''}\n`;
  (current.sections||[]).forEach(s=>{t+=`\n## ${s.title}\n`;(s.items||[]).forEach(it=>{t+=`- ${it.head}: ${it.body}\n`})});
  const cm=current.committee;
  if(cm&&cm.verdict)t+=`\n## 가상 투자위원회 의결\n${cm.verdict.result||''}\n${cm.verdict.summary||''}\n`;
  if(current.terms)t+=`\n## 오늘의 용어\n`+Object.entries(current.terms).map(([k,v])=>`- ${k}: ${v}`).join('\n')+'\n';
  return t.slice(0,14000);
}
async function answer(docRef,question){
  if(!sample){await docRef.update({replyStatus:'failed',reply:''}).catch(()=>{});return}
  const prompt=`당신은 한국 개인투자자를 돕는 친절하고 박식한 증권 리서치 어시스턴트입니다. 독자의 질문에 한국어로 답하세요.

답변 원칙:
1. 질문 주제에 제한을 두지 마세요. 반도체·메모리 업황, 국내외 증시, 거시경제, 개별 기업, 회계·재무, 투자 용어와 개념, 투자 방법론 등 무엇이든 당신이 가진 지식 전체를 활용해 충실히 답합니다. 아래 브리핑에 없는 내용이라는 이유로 답을 피하지 마세요.
2. 아래 브리핑은 참고 자료입니다. 질문이 브리핑에 나온 뉴스·수치와 관련되면 그것을 근거로 삼고, 관련이 없으면 브리핑을 굳이 언급하지 말고 일반 지식으로 답하세요.
3. 브리핑 이후의 최신 상황(오늘 장중 주가, 발표 직후 실적 등)은 알 수 없으므로, 그런 질문에는 브리핑 기준 시점을 밝히고 확인 방법을 알려 주세요. 모르는 것은 모른다고 하세요.
4. 어려운 용어는 괄호로 짧게 풀어 쓰고, 초보 투자자도 이해할 수 있게 설명하세요. 간단한 질문은 3~5문장, 설명이 필요한 질문은 문단을 나눠 충분히 답하되 서술형으로 씁니다.
5. 특정 종목의 매수·매도를 직접 권유하지 말고, 판단에 필요한 사실·관점·찬반 근거를 제시하세요.

=== 참고: ${current?current.date:''} 반도체 데일리 브리핑 ===
${briefAsText()}
=== 브리핑 끝 ===

독자 질문: ${question}`;
  try{
    const {text}=await sample(prompt,{modelTier:'default',cache:false});
    await docRef.update({reply:text,replyStatus:'done'});
  }catch(e){
    const partial=e&&e.text?e.text:'';
    await docRef.update(partial?{reply:partial+'\n\n(답변이 중간에 끊겼습니다)',replyStatus:'done'}:{replyStatus:'failed'}).catch(()=>{});
    if(e&&e.code==='not_granted')$('#note').textContent='AI 답변 권한이 허용되지 않아 답변을 만들 수 없습니다.';
  }
}

ame":"강반대","role":"악마의 대변인","stance":"경계","view":"모두가 틀릴 수 있는 길은 세 가지입니다. 첫째, 빅테크가 HBM 12단 대신 8단을 쓰고 테슬라처럼 자체 조달하면 '귀한 HBM'이 2027년엔 흔해질 수 있습니다. 둘째, 중국 CXMT의 DDR5가 실제 양산되면 범용 D램 가격이 먼저 꺾입니다. 셋째, 앤트로픽 IPO처럼 AI 기업의 자금 조달이 막히는 순간 데이터센터 투자가 멈추고, 메모리 주문 취소가 한꺼번에 옵니다. 영업이익률 80%는 정점의 모습이기도 합니다."}],"verdict":{"conditions":"① 영업이익 76조원 상회 ② 특별배당·소각이 '보도 수준(16조원)' 이상으로 공시 ③ 콘퍼런스콜에서 2027년 설비투자가 이익 성장을 넘지 않는다는 발언 ④ 외국인 순매수 연속 여부. 이 중 둘 이상이 어긋나면 분할 매수를 보류합니다. (가상 인물의 토론이며 투자 권유가 아닙니다.)","result":"보유 유지 + 실적 확인 후 분할 매수 (찬성 6 · 관망 2 · 반대 1)","summary":"위원회는 메모리 사이클이 아직 중기 초입이고 주가는 실적 대비 과도하게 조정됐다는 데 다수가 동의했습니다. 다만 내일 실적·주주환원 발표와 FOMC가 겹치는 만큼, 발표 전 추격 매수보다는 기존 보유분을 유지하고 발표 뒤 내용을 확인한 다음 나눠서 사는 쪽으로 의결했습니다. 최보수·강반대는 하루 10% 변동을 견딜 수 있는 비중인지 먼저 점검하라는 소수 의견을 남겼습니다.","tally":{"경계":1,"관망·중립":2,"매수·비중확대":4,"보유":2}}},"createdAt":"2026-10-27T17:30:00+09:00","date":"2026-10-27","quiz":[{"answer":1,"explain":"클로드 개발사 앤트로픽이 상장 신고서를 내며 매출 급증과 5,400억달러 이상의 컴퓨팅 약정을 공개하자 AI 인프라 투자가 이어질 것이란 기대가 살아났고, 반도체주가 급등했습니다.","options":["미국 연준의 긴급 금리 인하","앤트로픽의 나스닥 IPO 신청과 컴퓨팅 약정액 공개","삼성전자의 HBM4 엔비디아 납품 확정","국제유가 급락"],"q":"오늘 코스피가 급등한 가장 직접적인 계기로 꼽힌 소식은?"},{"answer":2,"explain":"평균 76조2,605억원입니다. 107조원은 삼성전자의 잠정 영업이익입니다.","options":["약 26조원","약 46조원","약 76조원","약 107조원"],"q":"증권사 10곳이 전망한 SK하이닉스 3분기 영업이익은 대략 얼마인가요?"},{"answer":1,"explain":"코스피200 선물이 급등하면 프로그램 매수 주문을 5분간 정지합니다. 오늘 장 초반 4%대 급등으로 발동됐습니다.","options":["외국인 매수를 제한하는 제도","선물이 급등할 때 프로그램 매수를 5분간 멈추는 안전장치","자사주를 자동으로 사들이는 프로그램","레버리지 ETF의 매수 상한"],"q":"'매수 사이드카'는 무엇인가요?"},{"answer":1,"explain":"HBM용 웨이퍼 비중이 20%에서 내년 30%에 가까워지면 범용 D램 생산 여력이 줄어 공급 부족과 가격 상승이 동시에 나타납니다.","options":["HBM4가 범용 D램을 원료로 쓰기 때문","한정된 D램 생산능력을 HBM에 우선 배정해 범용 D램 공급이 줄기 때문","범용 D램 공장이 모두 중국으로 이전해서","정부가 범용 D램 수출을 제한해서"],"q":"HBM4 양산 확대가 범용 D램 가격을 밀어 올리는 이유는?"},{"answer":1,"explain":"일본 낸드 업체 키옥시아의 지분을 판 돈이 재원으로 거론됐습니다. 솔리다임 IPO는 오히려 철회됐습니다.","options":["HBM 선수금","키옥시아 지분 매각 대금","솔리다임 IPO 공모 자금","회사채 발행"],"q":"보도된 SK하이닉스 특별배당(약 16조원)의 재원으로 거론된 것은?"}],"sections":[{"items":[{"body":"삼성전자는 잠정치로 3분기 영업이익 107조원을 넘겼고, SK하이닉스는 75~77조원이 예상됩니다. AI 데이터센터 투자 확대로 HBM 수요가 급증한 데다 서버용·범용 D램과 낸드 가격까지 오른 결과입니다. 하이닉스 영업이익률은 80%에 육박할 것으로 보입니다. 다만 이런 기대는 이미 주가에 반영돼 있어, 시장은 AI 반도체 수요가 얼마나 오래 가는지와 차세대 HBM 공급 계획을 더 주목하고 있습니다.","head":"삼성전자·SK하이닉스 3분기 합산 영업이익 184조원 전망, 메모리 슈퍼사이클 실적 신기록 예고","source":{"name":"SBS Biz","url":"https://biz.sbs.co.kr/article/20000342384"}},{"body":"메모리 업체들이 한정된 D램 생산능력을 HBM에 우선 배정하면서 PC·스마트폰용 범용 D램 공급이 빠듯해졌습니다. 트렌드포스는 4분기 범용 D램 계약가격이 전분기보다 10~15%, 낸드는 15~20% 오를 것으로 봤습니다. HBM에 쓰이는 웨이퍼 비중은 현재 D램 업계 전체의 약 20%에서 내년 30%에 가까워질 전망이라, 범용 D램 공급 부족이 2027년까지 구조적으로 길어질 수 있다는 분석이 나옵니다.","head":"HBM4 양산이 늘수록 범용 D램은 더 귀해진다… 4분기 D램 계약가격 10~15% 추가 상승 전망","source":{"name":"이투데이 · 포인트데일리","url":"https://www.etoday.co.kr/news/view/2632901"}},{"body":"RBC캐피털마켓은 14개 분기째 이어진 D램 상승 주기가 앞으로 5개 분기 더 갈 수 있다고 봤습니다. 하이닉스의 3분기 D램 계약가격은 전분기보다 20% 올랐고, 4분기에 15% 더 오를 가능성이 있다는 추정입니다. 대신증권도 내년 글로벌 메모리 시장이 1조5천억달러(약 2,000조원)로 60% 커지고 HBM 시장은 192% 급증할 것으로 전망했습니다.","head":"RBC \"메모리 공급 부족 2027년까지… SK하이닉스 HBM 가격 2027년 80~100% 상승 가능\"","source":{"name":"토큰포스트 · 파이낸셜뉴스","url":"https://www.tokenpost.kr/news/tech/427889"}},{"body":"메모리 가격 부담이 커지자 일부 고객사는 HBM을 12단 대신 8단으로 낮추거나 탑재량을 줄이는 설계 변경을 검토하고, 테슬라·스페이스X는 AI 반도체 자체 조달을 추진 중입니다. 다만 대신증권은 엔비디아 차세대 '루빈'은 HBM4 12단 구성을 유지할 것으로 분석했습니다. 반도체 호황이 정점에 가까운 것 아니냐는 우려와, 'TSMC·AI를 보면 피크아웃은 없다'는 반론이 맞서고 있습니다.","head":"경계 요인: 빅테크의 메모리 비용 절감 움직임과 '피크아웃' 논쟁","source":{"name":"이코노미트리뷴 · SBS Biz","url":"https://www.economytribune.co.kr/news/articleView.html?idxno=3904241"}}],"tag":"SEMI","title":"반도체 시황"},{"items":[{"body":"26일(현지시간) 다우 +0.28%, S&P500 +0.70%, 나스닥 +0.82%로 마감했습니다. 클로드 개발사 앤트로픽이 나스닥 상장 신고서를 내면서 상반기 매출이 1년 전보다 1,300% 넘게 늘었고 컴퓨팅 약정액이 최소 5,400억달러(약 700조원)라는 사실이 공개되자, AI 인프라 투자가 계속될 것이란 기대가 되살아났습니다. 마이크론·엔비디아가 강세였고, 코어위브 같은 네오클라우드도 낙폭을 만회했습니다. 다만 필라델피아 반도체지수는 10월 들어 여전히 12% 가까이 빠진 상태입니다.","head":"뉴욕증시 3대 지수 상승 마감… 앤트로픽 IPO 신청에 AI주 반등, 필라델피아 반도체지수 +2.82%","source":{"name":"뉴스핌","url":"https://www.newspim.com/news/view/20261027000010"}},{"body":"연준은 28일 금리를 결정하며 동결이 예상되고, 시장은 12월 인상 신호 여부를 주시합니다. ECB(29일)·일본은행(30일)도 통화정책을 발표합니다. 미국 10년물 금리는 4.96%로 최근 3년 중 상위 3% 수준의 고점권이고, 하이일드 스프레드도 높아져 신용시장 경계감이 남아 있습니다. 알파벳·메타·아마존 등 S&P500 기업의 3분의 1 이상이 이번 주 실적을 내놓아 AI 투자 수익성이 시험대에 오릅니다.","head":"이번 주 '슈퍼위크': 28일 FOMC, 29일 PCE 물가, 빅테크 실적 줄줄이","source":{"name":"뉴스핌 · 치킨스탁","url":"https://www.newspim.com/news/view/20261026001237"}},{"body":"미국·이스라엘의 이란 공습 재개 가능성으로 지난주 유가가 6개월 만에 최고치로 급등했지만, 26일에는 WTI가 2% 내린 101달러, 브렌트유가 114달러선으로 내려오며 인플레이션 우려가 다소 완화됐습니다. 금값은 3개월 저점에서 반등했고 달러는 강세를 보였습니다. 유가·고금리·AI 거품론 세 가지가 해소되지 않아 변동성은 이어질 수 있다는 관측입니다.","head":"중동 긴장은 여전, 유가는 숨 고르기… WTI 배럴당 101달러","source":{"name":"뉴스핌 글로벌 마켓 리포트","url":"https://newspim.com/news/view/20261027000296"}}],"tag":"GLOBAL","title":"세계 시장 전망"},{"items":[{"body":"전날 7개월 만의 최저치(5,469)까지 밀렸던 코스피가 하루 만에 반등했습니다. 장 초반 4%대 급등으로 매수 사이드카가 발동됐고 장중 5,700선을 회복하기도 했습니다. 외국인과 기관이 함께 사들였고 삼성전자 +4.23%, SK하이닉스 +5.18%로 반도체 대형주가 지수를 끌어올렸습니다. 코스닥은 2.29% 오른 743.83으로 마감했습니다.","head":"코스피 3.09% 급등, 5,600선 회복… 외국인 순매수 복귀, 장중 매수 사이드카 발동","source":{"name":"뉴스핌 마감시황","url":"https://www.newspim.com/news/view/20261027000983"}},{"body":"반도체를 중심으로 수출이 2.3% 늘며 성장을 이끌었고 정부소비·설비투자도 증가했습니다. 한국은행이 제시했던 연간 성장률 전망 3.3%도 상향 조정될 가능성이 커졌습니다. 반대로 10월 소비심리는 증시 조정 여파로 한 달 만에 하락했습니다.","head":"3분기 한국 GDP 1.0% 깜짝 성장… 한은 전망치(0.3%)의 3배 이상","source":{"name":"SBS 뉴스","url":"https://news.sbs.co.kr/news/endPage.do?news_id=N1008817349"}},{"body":"반도체 대형주 반등이 소재·부품·장비 기업으로 번지며 반도체 소부장 ETF가 수익률 상위권을 휩쓸었습니다. SK하이닉스 단일종목 레버리지 상품도 10% 안팎 올랐습니다. 반면 바이오·의료AI 관련 ETF는 약세였습니다. 참고로 골드만삭스는 전날 코스피 12개월 목표지수를 12,000에서 9,000으로 25% 낮췄고, 키움증권은 이번 주 코스피 예상 범위를 5,300~5,800으로 제시했습니다.","head":"반도체 레버리지 ETF 11% 급등, 인버스는 10% 급락… 소부장 ETF도 상위권","source":{"name":"뉴스핌 ETF 시황","url":"https://www.newspim.com/news/view/20261027001214"}}],"tag":"KOSPI","title":"국내 증시 · 주식 뉴스"},{"items":[{"body":"증권사 10곳 평균 전망치는 매출 96조9,747억원, 영업이익 76조2,605억원입니다(2분기 영업이익 60조5,426억원, 영업이익률 76.3%에 이어 6개 분기 연속 사상 최대). 연간 영업이익 전망은 262조원에 달합니다. 그러나 주가는 7월 27일 181만6천원에서 10월 26일 127만5천원으로 석 달 새 29.8% 떨어졌고 종가 기준 고점 대비로는 50% 넘게 빠져, 시장은 실적 자체보다 추가 주주환원 방안과 호황의 지속 가능성을 보고 있습니다.","head":"내일(28일) 오전 3분기 실적 발표… 매출 97조·영업이익 76조원 전망, 관심은 주주환원","source":{"name":"SBS Biz","url":"https://biz.sbs.co.kr/article/20000342249"}},{"body":"동아일보 보도에 따르면 SK하이닉스는 키옥시아 지분 매각 대금을 활용한 대규모 특별배당을 검토 중이며, 회사도 주주환원 확대 방안을 여러 갈래로 검토하고 있다고 확인했습니다. 삼성전자와 하이닉스를 합치면 최대 120조원 규모의 주주환원이 이번 주 발표될 수 있다는 전망도 나옵니다. 현금배당과 자사주 매입·소각을 함께 추진할 방침입니다. 삼성전자는 29일 실적과 함께 환원책을 발표합니다.","head":"\"약 16조원(120억달러) 특별배당 검토\" 보도… 재원은 키옥시아 지분 매각 대금","source":{"name":"Investing.com · 위키트리","url":"https://kr.investing.com/news/stock-market-news/article-93CH-2142274"}},{"body":"중국 CXMT가 데이터센터용 DDR5 개발 성과를 주장한 뒤 메모리주가 흔들렸지만, 로젠블라트증권은 하이닉스의 D램 수요 전망이 구조적으로 견조하다는 의견을 재확인했습니다. 하이닉스와 삼성전자가 AI용 저장장치 수요에 맞춰 중국 내 낸드 생산시설 설비 개선을 계획 중이라는 보도도 나왔습니다. 미국 ADR 기준으로는 10월 초 52주 최고가 대비 약 30% 낮은 수준이라 실적 발표 전 저가 매수가 유입된 것으로 풀이됩니다. 한편 하이닉스는 자회사 솔리다임의 IPO를 철회했는데, 이는 마이크론·샌디스크에는 호재로 해석됐습니다.","head":"오늘 주가 +5.2~6.9%… 로젠블라트 \"CXMT 우려로 인한 낙폭은 과도, D램 수요 구조적으로 견조\"","source":{"name":"Investing.com","url":"https://kr.investing.com/news/stock-market-news/article-93CH-2141552"}},{"body":"① 영업이익이 전망치(약 76조원)를 넘는지와 영업이익률 80% 달성 여부 ② 특별배당·자사주 소각 등 주주환원 규모와 지급 방식 ③ 내년 메모리 수급 전망과 설비투자 규모 ④ HBM4 공급 계획과 삼성전자와의 HBM 격차 ⑤ 성과급(영업이익 10%) 재원과 마이크론 대만 노사갈등 등 업계 변수. 콘퍼런스콜 발언이 주가 방향을 좌우할 가능성이 큽니다.","head":"내일 실적 발표 체크포인트","source":{"name":"종합","url":"https://biz.sbs.co.kr/article/20000342384"}}],"tag":"000660","title":"SK하이닉스"}],"summary":"앤트로픽 IPO 신청 소식에 AI 투자 기대가 되살아나며 코스피가 3% 넘게 반등했고(매수 사이드카 발동), SK하이닉스는 5~7%대 급등해 134만~136만원대에서 마감했습니다. 내일(28일) 하이닉스 3분기 실적 발표에서 약 76조원의 영업이익과 특별배당 등 주주환원 계획이 나올지가 최대 관심사입니다. 같은 날 미국 FOMC 금리 결정, 29일 PCE 물가와 삼성전자 실적까지 겹치는 '슈퍼위크'입니다.","terms":{"ADR":"미국예탁증서. 해외 기업 주식을 미국 증시에서 거래할 수 있게 만든 증권으로, SK하이닉스는 나스닥에 'SKHY'로 상장돼 있습니다.","DDR5":"현재 주력인 5세대 범용 D램 규격. 서버·PC에 널리 쓰입니다.","루빈":"엔비디아가 2026년부터 내놓는 차세대 AI 가속기(GPU) 플랫폼 이름. HBM4를 처음 대량으로 쓰는 제품입니다.","설비투자":"공장·장비 등 생산능력을 늘리기 위한 투자. 메모리 업계에서는 공급 증가(=가격 하락 압력)의 신호로 읽힙니다.","솔리다임":"SK하이닉스가 인텔 낸드 사업을 인수해 만든 미국 SSD 자회사입니다.","콘퍼런스콜":"실적 발표 뒤 회사 경영진이 애널리스트·투자자와 전화로 질의응답하는 자리. 향후 전망에 대한 발언이 나옵니다.","트렌드포스":"대만의 반도체·메모리 시장조사 업체. 분기별 메모리 가격 전망으로 유명합니다.","현물가격":"그때그때 시장에서 소량으로 거래되는 메모리 가격. 계약가격보다 먼저 움직여 선행 지표로 봅니다."},"ticker":[{"chg":"+3.09%","name":"코스피","value":"5,600선 회복"},{"chg":"+2.29%","name":"코스닥","value":"743.83"},{"chg":"+5.2~6.9%","name":"SK하이닉스","value":"1,341,000~1,363,000원"},{"chg":"+4.23%","name":"삼성전자","value":""},{"chg":"+2.82%","name":"필라델피아 반도체","value":"26일 美 마감"},{"chg":"+0.82%","name":"나스닥","value":"26일 美 마감"},{"chg":"고점권","name":"美 10년물 금리","value":"4.96%"},{"chg":"-2.0%","name":"WTI 유가","value":"약 $101"}]},{"committee":{"members":[{"name":"김버핏","role":"가치투자의 대가","stance":"보유","view":"자사주 2,407만주를 전량 소각하고 잉여현금흐름의 절반 이상을 돌려주겠다는 회사는 주주를 동업자로 보는 경영진이라 평가할 만합니다. 영업이익률 78%는 오래 가기 어려운 수치지만, 10년 장기공급계약을 요구하는 고객이 있다는 건 해자가 생각보다 깊다는 뜻입니다. 오늘 실적보다 설비투자 재원을 빚으로 조달하는지, 현금으로 감당하는지를 보겠습니다. 가격은 합리적이지만 하루 5% 오른 날 사는 건 제 방식이 아닙니다."},{"name":"하젠슨","role":"AI 산업의 미래학자","stance":"비중확대","view":"은행과 사모펀드가 630억달러를 모아 브로드컴 칩을 사서 앤트로픽에 빌려주고, 올해 AI 회사채 발행이 3,000억달러를 넘었다는 건 AI 인프라가 '주식 자본'에서 '부채 자본' 단계로 넘어갔다는 신호입니다. 이 단계에선 투자 규모가 한 차원 커집니다. 다음 돈은 HBM뿐 아니라 서버용 D램과 기업용 SSD로 흐르고, 대신증권의 HBM 시장 192% 성장 전망이 그 방향을 가리킵니다. 하이닉스는 그 길목에 서 있습니다."},{"name":"최보수","role":"원금 보존 전문가","stance":"경계","view":"오늘은 실적 발표, 내일 새벽은 FOMC, 모레는 삼성 실적입니다. 사흘 연속 하루 10% 변동이 가능한 일정인데 어제 이미 5% 올랐습니다. 신용융자로 산 분은 '좋은 실적에 급락' 시나리오에서 반대매매가 나올 수 있는 구간이니 오늘 오전에 비중을 점검하는 게 먼저입니다. 최악의 경우는 실적은 좋은데 환원안이 16조원 특별배당 보도에 못 미치고 FOMC가 매파적으로 나오는 조합입니다. 그 경우 어제 상승분은 하루 만에 사라질 수 있습니다."},{"name":"레이달리","role":"거시경제 전략가","stance":"관망","view":"유가가 100달러 아래로 내려오고 10년물이 5%에서 살짝 물러난 건 좋은 조합이지만, 연준은 아직 긴축 사이클 안에 있고 12월 인상 확률이 더 높습니다. 소비자신뢰지수가 넉 달 만에 최고라는 건 경기가 강하다는 뜻이자 금리를 내릴 이유가 없다는 뜻이기도 합니다. 돈은 지금 미 국채에서 AI 회사채로, 한국에선 외국인이 삼성전자에서 하이닉스로 되돌아오는 중입니다. 원화가 1,320원대로 강해진 건 외국인 유입엔 좋지만 수출 이익엔 부담이라, 오늘 밤 FOMC 뒤 달러 방향을 보고 판단하겠습니다."},{"name":"반도체박","role":"반도체 업황 분석가","stance":"매수","view":"DDR5 현물가격 6주 연속 상승, 3분기 계약가격 +20%에 4분기 +15% 전망, HBM용 웨이퍼 비중 30% 접근까지 가격·물량·믹스가 모두 좋아지는 사이클 중기 초입입니다. 4분기 영업이익 컨센서스 87조원은 3분기보다 13% 높아서 분기마다 이익이 계단식으로 오르는 구간입니다. 이익 정점은 CXMT와 신규 팹의 비트가 시장에 나오는 2027년 후반 이후로 봅니다. 다만 삼성 HBM4 수율 80%와 UBS의 내년 점유율 역전 전망은 하이닉스 HBM 프리미엄이 깎일 수 있다는 뜻이라 콘퍼런스콜에서 HBM4 가격 방어 발언을 확인해야 합니다."},{"name":"드러켄","role":"시장 심리·수급 전략가","stance":"보유","view":"외국인이 4거래일 만에 현물·선물을 함께 샀고 거래대금 2조7천억원이 몰린 건 포지션이 비어 있던 쪽에서 되돌림이 나온 겁니다. 시장은 77조원 영업이익을 이미 반영했고, 지금 가격에 안 들어간 건 '30조원 이상 추가 환원'이 숫자로 확인되느냐입니다. 환원안이 기대를 넘으면 공매도·언더웨이트 포지션의 되감기가 추세를 만들고, 못 미치면 어제 산 외국인이 먼저 팝니다. 발표 전에 추가하는 건 동전 던지기라 보유로 가고, 발표 뒤 첫 30분 거래량을 보고 움직이겠습니다."},{"name":"하워드","role":"시장 사이클·역발상 전문가","stance":"분할 매수","view":"지난주 골드만삭스가 코스피 목표를 25% 낮추고 '7개월 최저' 기사가 쏟아졌는데, KB증권은 밸류에이션이 금융위기 수준보다 낮다고 합니다. 공포가 걷히기 시작한 건 맞지만 어제 한 번의 3% 반등으로 탐욕으로 돌아선 건 아닙니다. 고점 대비 41% 빠진 주식의 실적이 사상 최대라면 위험 대비 보상은 여전히 매수 쪽에 기울어 있습니다. 다만 앤트로픽 IPO 열기가 반도체를 과하게 띄웠다는 경계도 나오니, 이번 주 세 이벤트에 나눠서 사는 게 역발상의 정석입니다."},{"name":"윤팩트","role":"회계·실적 검증 전문가","stance":"중립","view":"확인된 사실은 자사주 40조원 매입 완료, 2,407만주 소각 계획, 26일 공시의 '추가 환원 검토'까지입니다. '16조원 특별배당'과 'NH 30조원 이상'은 보도와 추정이지 공시가 아닙니다. 오늘 숫자에서 볼 건 세 가지입니다. 영업이익 76.96조원 상회 여부, 성과급 재원이 영업이익에서 얼마나 빠졌는지, 그리고 키옥시아 지분 매각 차익이 영업외이익으로 잡혀 당기순이익을 일회성으로 부풀렸는지입니다. 환원이 일회성 매각 차익에 기댄 것이라면 지속 가능한 배당으로 평가하면 안 됩니다."},{"name":"강반대","role":"악마의 대변인","stance":"경계","view":"여덟 분이 모두 '사이클 중기'라고 하는데, 그 근거인 장기공급계약은 가격이 오를 때 고객이 서두르는 것이지 가격이 꺾이면 재협상 대상이 됩니다. 630억달러 칩 임대 구조는 앤트로픽이 돈을 못 벌면 은행이 떠안는 차입 투자이고, AI 회사채 3,000억달러는 2000년 통신 광케이블 채권과 닮았습니다. 삼성 HBM4 수율 80%, UBS의 점유율 역전 전망, CXMT 증설까지 공급 쪽 뉴스는 전부 하이닉스에 불리한 방향입니다. 우리가 틀린다면 '사상 최대 실적'이 곧 '이익의 정점'이었다는 식으로 틀릴 겁니다. 영업이익률 78%는 축하할 숫자가 아니라 경쟁자가 몰려드는 신호입니다."}],"verdict":{"conditions":"① 3분기 영업이익 76.96조원 상회와 영업이익률 78% 달성 여부 ② 추가 주주환원이 보도 수준(특별배당 16조원·추가 재원 30조원 이상)에 부합하는지, 재원이 일회성 매각 차익인지 ③ 콘퍼런스콜에서 루빈용 HBM4 공급 일정과 가격 방어, 증설 재원 조달 방식(현금·대출·회사채)에 대한 답변 ④ 한국시간 29일 새벽 FOMC의 12월 인상 신호 강도와 그 뒤 외국인 순매수 지속 여부. 이 중 둘 이상이 어긋나면 분할 매수를 보류합니다. (가상 인물의 토론이며 투자 권유가 아닙니다.)","result":"보유 유지, 오늘 실적·주주환원안 확인 뒤 분할 매수 검토 (찬성 5 · 관망 2 · 경계 2)","summary":"위원회는 간밤 630억달러 칩 임대 금융과 AI 회사채 급증이 AI 인프라 투자의 돈줄이 아직 마르지 않았음을 보여주고, 메모리 가격과 4분기 컨센서스가 계단식으로 오르는 사이클 중기 초입이라는 데 다수가 동의했습니다. 그러나 오늘 실적·환원안, 내일 새벽 FOMC, 모레 삼성전자 실적이 사흘 연속 이어지는 만큼 발표 전 추격 매수는 피하고, 추가 환원이 공시 숫자로 확인된 뒤 나눠서 사는 쪽으로 의결했습니다. 최보수·강반대는 삼성 HBM4 수율과 CXMT 증설 등 공급 측 악재가 쌓이고 있어 '사상 최대 실적이 이익 정점일 수 있다'는 소수 의견을 남겼습니다.","tally":{"경계·축소":2,"관망·중립":2,"매수·비중확대":3,"보유":2}}},"createdAt":"2026-10-28T07:40:00+09:00","date":"2026-10-28","quiz":[{"answer":1,"explain":"뱅크오브아메리카·씨티·모건스탠리·블랙스톤 등이 브로드컴 칩과 네트워크 장비를 사들여 앤트로픽에 임대하는 사업에 630억달러를 조달한다는 소식이었고, 브로드컴이 4% 올랐습니다.","options":["앤트로픽이 자체 데이터센터를 짓기 위한 회사채 발행","은행·사모펀드가 브로드컴 AI 반도체를 사서 앤트로픽에 빌려주는 사업","엔비디아의 HBM4 선구매 자금","SK하이닉스 미국 공장 건설 대출"],"q":"간밤 미국 반도체주를 끌어올린 630억달러 자금 조달은 무엇을 위한 것이었나요?"},{"answer":1,"explain":"영업이익 76조9,640억원, 영업이익률 78.4%가 컨센서스입니다. 60.5조원은 2분기 실적, 87조원은 4분기 전망치입니다.","options":["약 60조원, 76%","약 77조원, 78%","약 87조원, 80%","약 107조원, 70%"],"q":"SK하이닉스 3분기 영업이익 컨센서스(에프앤가이드 기준)와 영업이익률 전망은?"},{"answer":0,"explain":"약 40조원어치 매입을 10월 21일 예정보다 한 달 앞당겨 끝냈고, 매입한 2,407만주는 전량 소각할 계획입니다.","options":["약 2,407만주(발행주식의 약 3.3%)","약 1,000만주(약 1.4%)","약 5,000만주(약 7%)","아직 매입을 시작하지 않았다"],"q":"SK하이닉스가 전량 소각하기로 한 자사주 규모는?"},{"answer":2,"explain":"이란 지도부의 분쟁 종식 조건 논의와 주변국 외교 접촉 소식에 긴장 완화 기대가 커지면서 WTI는 1.83% 내린 99.90달러로 마감했습니다.","options":["OPEC+의 대규모 증산 결정","미국 전략비축유 방출","이란 지도부가 분쟁 종식 조건을 논의하며 중동 긴장 완화 기대가 커져서","중국 경기 둔화로 수요가 줄어서"],"q":"WTI 유가가 배럴당 100달러 아래로 내려온 이유로 기사들이 꼽은 것은?"},{"answer":1,"explain":"UBS는 삼성전자의 HBM4 수율 개선을 근거로 내년 비트 출하량에서 삼성 41%, 하이닉스 39%로 삼성이 근소하게 앞설 것으로 봤습니다. '50% 대 33%'는 2분기 매출 점유율입니다.","options":["SK하이닉스 60% vs 삼성전자 25%","삼성전자 41% vs SK하이닉스 39%","마이크론 50% vs SK하이닉스 30%","SK하이닉스 50% vs 삼성전자 33%"],"q":"UBS가 전망한 내년 HBM 비트 출하량 점유율은?"}],"sections":[{"items":[{"body":"대신증권은 글로벌 메모리 시장이 올해 약 9,500억달러에서 내년 1조5,188억달러로 60% 커질 것으로 내다봤습니다. 범용 D램은 55%, HBM은 192% 성장해 HBM 시장만 약 217조원에 이른다는 계산입니다. 내년 HBM 평균판매가격은 올해보다 89% 오르고, 서버용 D램은 올 4분기부터 내년 1분기까지 두 분기에 걸쳐 10% 중반 상승이 예상됩니다. 클라우드 업체들이 장기공급계약 기간과 규모를 늘리고 있는데, 일부 고객은 2035년까지 10년 공급 보장을 요구했다고 합니다. 공급사들은 공장은 미리 짓되 장비 투자는 수요에 맞춰 집행하는 신중한 태도를 유지하고 있습니다.","head":"대신증권 \"내년 메모리 시장 1조5천억달러(약 2,015조원), 60% 성장\"… HBM 가격 89% 상승 전망","source":{"name":"파이낸셜뉴스","url":"https://www.fnnews.com/news/202610251630073141"}},{"body":"트렌드포스 집계 기준 DDR5 16Gb 현물가격은 9월 초 54달러대에서 10월 23일 61달러대로 6주 연속 올랐습니다. HBM은 같은 용량의 DDR5보다 약 3배 많은 웨이퍼를 쓰는데, HBM용 웨이퍼 비중이 D램 업계 전체 생산능력의 약 20%에서 내년 30%에 가까워질 전망이라 범용 D램에 돌릴 생산 여력이 계속 줄어듭니다. KB증권은 2027년 범용 D램 공급 부족이 구조적으로 길어질 것으로 봤고, RBC는 14개 분기째 이어진 D램 상승 주기가 5개 분기 더 갈 수 있다고 분석했습니다.","head":"DDR5 현물가격 6주 연속 상승… 16Gb 61달러대, HBM 웨이퍼 비중 내년 30% 육박","source":{"name":"이투데이 · 토큰포스트","url":"https://www.etoday.co.kr/news/view/2632901"}},{"body":"시가총액 합계 2조달러가 넘는 삼성전자·SK하이닉스·키옥시아·CXMT가 이번 주 잇따라 실적을 내놓습니다. 일본 낸드 업체 키옥시아는 7~9월 영업이익이 1년 전보다 20배 이상 늘어난 것으로 추정되며, 낸드 가격과 장기공급계약이 관전 포인트입니다. 반면 중국 CXMT는 범용 D램 생산능력을 두 배로 키우고 있어 2027년 이후 공급과잉 우려의 진원지로 꼽힙니다. 다만 CXMT는 제품 사양 공개 없이 청사진만 내놓은 상태라 양산까지 최소 2년이 걸린다는 반론도 있습니다.","head":"아시아 메모리 4강 실적 주간… 키옥시아 영업이익 20배 전망, CXMT 증설은 공급과잉 변수","source":{"name":"뉴스1","url":"https://www.news1.kr/world/international-economy/6333165"}},{"body":"SK하이닉스의 HBM 독주에 경고등이 켜졌다는 분석이 나옵니다. 삼성전자의 HBM4 수율이 80% 안팎까지 올라온 것으로 알려졌고, 2분기 HBM 매출 점유율 격차는 1분기 37%포인트에서 17%포인트(하이닉스 50% 대 삼성 33%)로 좁혀졌습니다. UBS는 내년 HBM 비트 출하량에서 삼성이 근소하게 앞설 수 있다고 봤습니다. 여기에 엔비디아 루빈 출시가 일부 늦어지고 양산 제품의 성능 조율이 길어지면서 하이닉스의 HBM4 출하량이 당초 기대에 못 미칠 수 있다는 관측도 있습니다.","head":"삼성전자 HBM4 수율 80% 안팎… UBS \"내년 비트 출하량은 삼성 41% vs 하이닉스 39%\"","source":{"name":"서울경제TV","url":"https://www.sentv.co.kr/article/view/sentv202610210078"}}],"tag":"SEMI","title":"반도체 시황"},{"items":[{"body":"27일(현지시간) 다우 +0.03%, S&P500 +0.60%, 나스닥 +1.18%로 마감했고 필라델피아 반도체지수는 3.60% 급등한 11,482.51로 사흘 연속 올랐습니다. 뱅크오브아메리카·씨티·모건스탠리·블랙스톤 등이 브로드컴의 AI 반도체와 네트워크 장비를 사들여 앤트로픽에 빌려주는 사업에 630억달러를 조달한다는 소식이 반도체 매수세를 불렀습니다. 브로드컴 +4.0%, AMD +5.5%, 마이크론 +2.8%, 인텔 +3.6%, 엔비디아 +0.9%였고, 변동성지수(VIX)는 17.48로 5% 내렸습니다. 다만 AI 기업 상장 열기가 반도체 업종을 다소 과도하게 끌어올렸을 수 있다는 경계의 목소리도 있습니다.","head":"뉴욕증시 이틀째 상승, 나스닥 +1.18%… 앤트로픽용 브로드컴 칩 임대에 630억달러 조달, 반도체지수 +3.6%","source":{"name":"뉴스핌","url":"https://www.newspim.com/news/view/20261028000019"}},{"body":"연준은 27~28일 회의를 열고 한국시간 29일 새벽 결과를 내놓습니다. 현재 기준금리는 3.75~4.00%이며 페드워치 기준 동결 확률이 90%를 넘지만, 시장은 워시 의장이 12월 추가 인상 신호를 내느냐에 더 주목합니다. 에드워드존스는 연말 인상에 이어 2027년 한 차례 더 인상을 예상했고, 도이체방크는 동결이어도 매파적 메시지가 나올 수 있다고 봤습니다. 10월 소비자신뢰지수는 91.7로 6월 이후 최고치를 기록해 경기 둔화 우려를 덜었습니다. 29일에는 PCE 물가와 ECB 금리 결정, 알파벳·마이크로소프트·아마존 실적이 이어집니다.","head":"오늘 밤 FOMC 결과 발표… 동결 확률 90%, 관건은 12월 인상 신호","source":{"name":"블록미디어","url":"https://www.blockmedia.co.kr/archives/1157196"}},{"body":"WTI 12월물은 1.83% 내린 배럴당 99.90달러, 브렌트유는 1.67% 내린 113.88달러로 마감했습니다. 이란 지도부가 분쟁 종식 조건을 논의하고 주변국과 외교 접촉을 이어간다는 소식에 중동 긴장 완화 기대가 커진 결과로, 브렌트유는 이틀간 2.4% 내려 10월 들어 가장 큰 낙폭이었습니다. 유가 하락은 인플레이션 우려를 눌러 증시 투자심리를 도왔습니다. 금 선물은 0.69% 오른 온스당 4,066달러대에서 거래됐고, 미국 10년물 금리는 5% 안팎의 고점권에서 소폭 내려왔습니다. NH투자증권은 미국 중간선거 이후 미국·이스라엘의 대이란 군사작전 확대 여부가 유가의 핵심 변수라고 짚었습니다.","head":"WTI 100달러 아래로… 이란 '분쟁 종식 조건' 논의에 긴장 완화 기대, 금은 4,066달러","source":{"name":"머니투데이방송","url":"https://news.mtn.co.kr/article/2026102806133360198"}},{"body":"블랙록의 릭 리더 최고투자책임자는 AI 투자 열풍이 채권시장으로 번지면서 장기 국채보다 AI 관련 회사채가 더 나은 투자처가 됐다고 말했습니다. 올해 AI 관련 우량 회사채 발행이 3,000억달러를 넘어 지난해의 약 3배에 달하고, 단기 A등급 채권에서 7% 안팎의 수익률을 기대할 수 있다는 설명입니다. 10년물 국채는 투자 대상이라기보다 시장 지표로 보는 게 낫다고도 했습니다. 빅테크가 설비투자 재원을 채권으로 조달하는 흐름이 계속되는 한 메모리 수요의 돈줄은 유지된다는 뜻이지만, 코어위브 같은 네오클라우드의 신용 위험이 높아졌다는 경고도 함께 나옵니다.","head":"블랙록 CIO \"주말 내내 AI 회사채 거래… 미 국채보다 매력적\", 올해 AI 우량채 발행 3,000억달러 돌파","source":{"name":"뉴스1","url":"https://www.news1.kr/world/international-economy/6333217"}}],"tag":"GLOBAL","title":"세계 시장 전망"},{"items":[{"body":"어제 코스피는 개장 직후 4% 넘게 뛰며 오전 10시 13분 올해 53번째 매수 사이드카가 발동됐고, 장중 5,737.61(+4.90%)까지 올랐다가 상승폭을 일부 줄여 5,638.34로 마감했습니다. 외국인이 약 5,930억원, 기관이 약 2,800억원을 순매수했고 개인은 9,500억원 가까이 팔았습니다. 전기·전자 업종이 4.48% 올라 지수를 끌어올렸고, 삼성전기(+7.4%)·SK스퀘어(+7.7%)가 동반 급등한 반면 삼성바이오로직스는 5%대 내리며 바이오가 약세였습니다. 코스닥은 2.29% 오른 743.83으로, 에코프로(+6.5%)·심텍(+8.6%)이 강했습니다. 원/달러 환율은 2.4원 내린 1,324.6원이었습니다.","head":"코스피 3.09% 급등한 5,638.34 마감… 외국인 4거래일 만에 현·선물 동반 순매수, 장중 5,737까지","source":{"name":"파이낸셜뉴스","url":"https://www.fnnews.com/news/202610271620317697"}},{"body":"대신증권 이경민 연구원은 앤트로픽의 매출 급증 공개로 AI 투자가 실제 수익으로 이어진다는 기대가 살아나 AI 반도체 중심의 저가 매수가 유입됐다고 분석했습니다. 키움증권 한지영 연구원은 미국 AI주 불안이 진정되고 코스피 이익 컨센서스가 훼손되지 않았다며, 주식 비중을 더 줄이기보다 기존 포지션을 유지하는 쪽을 우선순위로 제시했습니다. KB증권 김동원 리서치본부장은 코스피가 7월 29일(5,262)과 10월 15일(5,450)의 W자 바닥을 확인했고 코스피·삼성전자·SK하이닉스 밸류에이션이 과거 금융위기 수준을 밑도는 '역사적 저평가 영역'이라고 진단했습니다. NH투자증권은 이번 주 코스피 예상 범위를 5,100~6,400으로 넓게 잡았습니다.","head":"증권가 \"AI 투자 수익화 기대 회복, 코스피 이익 전망 훼손 없어… 기존 포지션 유지가 우선\"","source":{"name":"디지털투데이 · 이슈온","url":"https://www.digitaltoday.co.kr/news/articleView.html?idxno=710339"}},{"body":"오늘 오전 SK하이닉스 3분기 실적과 콘퍼런스콜이 열리고, 이사회 뒤 추가 주주환원안이 공개됩니다. 한국시간 29일 새벽에는 FOMC 결과가, 29일에는 삼성전자 확정 실적이 나옵니다. 삼성전자는 이달 말 이사회에서 정규배당을 포함해 약 30조원의 현금배당을 정할 전망이며, 올해 전체 주주환원 90조~110조원 가운데 나머지는 내년 1월 실적 확정 뒤 집행될 것으로 전해졌습니다. 지난주 외국인이 SK하이닉스를 8,637억원 팔고 삼성전자를 7,838억원 샀던 만큼, 실적 발표 뒤 외국인 수급이 어느 쪽으로 쏠리는지가 지수 방향을 가를 변수입니다. 지수가 반등하면 고점에 산 투자자의 매도 물량이 나올 수 있다는 점도 유의할 대목입니다.","head":"오늘·내일 일정: 28일 SK하이닉스 실적·주주환원, 29일 새벽 FOMC, 29일 삼성전자 확정 실적과 약 30조원 배당","source":{"name":"머니투데이","url":"https://www.mt.co.kr/stock/2026/10/26/2026102519124283846"}}],"tag":"KOSPI","title":"국내 증시 · 주식 뉴스"},{"items":[{"body":"SK하이닉스는 장중 138만1천원까지 올랐다가 134만1천원(+5.18%)으로 마감해 10월 15일 11% 급락 이후 9거래일 만에 종가 130만원대를 되찾았습니다. 외국인이 5,910억원을 순매수했고 거래대금은 오후 2시 기준 이미 2조7천억원을 넘겨 시장 자금이 집중됐습니다. 미국 ADR(SKHY)도 간밤 장 초반 2% 안팎 올랐습니다. 다만 주가는 7월 27일 181만6천원에서 석 달 새 약 30% 낮은 수준이고 고점 대비로는 41% 하락 상태라, 시장은 실적 자체보다 호황이 얼마나 오래가는지와 주주환원 규모를 확인하려는 분위기입니다.","head":"어제 +5.18%, 134만1천원 마감… 9거래일 만에 130만원대 회복, 외국인 5,910억원 순매수","source":{"name":"대구신문 · 잡포스트","url":"https://www.idaegu.co.kr/news/articleView.html?idxno=563584"}},{"body":"에프앤가이드 컨센서스는 매출 98조2,257억원, 영업이익 76조9,640억원으로 1년 전보다 각각 302%, 576% 늘어난 수치이며 영업이익률은 78.4%에 이릅니다. 2분기(매출 79조3,187억원, 영업이익 60조5,426억원)에 이어 6개 분기 연속 사상 최대가 유력하고, 4분기 영업이익 컨센서스는 87조2,701억원입니다. 카운터포인트리서치는 범용 D램·낸드 가격 급등이 실적을 견인했으며 장기공급계약 확대와 우호적 가격 체계가 유지되면 이익이 아직 정점이 아니고 최소 내년까지 상승 흐름이 이어질 수 있다고 봤습니다. 콘퍼런스콜에서는 루빈용 HBM4의 품질 인증·공급 현황, 환율, 투자 재원 조달 방식이 핵심 질문이 될 전망입니다.","head":"오늘 3분기 실적 발표: 매출 98조·영업이익 77조원 컨센서스, 영업이익률 78% 전망… 4분기는 87조원","source":{"name":"이투데이","url":"https://www.etoday.co.kr/news/view/2640820"}},{"body":"SK하이닉스는 약 40조원 규모 자사주 매입을 예정보다 한 달 앞당겨 10월 21일 끝냈고, 매입한 2,407만주(발행주식의 약 3.3%)는 전량 소각할 계획입니다. 26일 공시에서 추가 주주환원 방안을 검토 중이며 이사회 결의 뒤 오늘 실적 발표 때 공개한다고 밝혔습니다. 기존 방침은 2025~2027년 누적 잉여현금흐름의 50% 이상 환원이며, NH투자증권은 추가 환원 재원을 30조원 이상으로 추정했습니다. 키옥시아 지분 매각 차익을 활용한 16조원 규모 특별배당 보도는 아직 미확정입니다. 메리츠증권은 예상보다 강화된 환원책 가능성이 높다고 봤지만, 증설 재원(내부 현금·대출·회사채 중 미정)과 환원 규모가 서로 상충할 수 있다는 점은 변수입니다.","head":"주주환원 관전 포인트: 40조원 자사주 매입 조기 완료, 2,407만주 전량 소각… NH \"추가 재원 30조원 이상\"","source":{"name":"중앙이코노미뉴스 · 이슈온","url":"https://www.joongangenews.com/news/articleView.html?idxno=558506"}},{"body":"낸드 자회사 솔리다임의 미국 상장 추진은 주주가치 훼손 논란 끝에 79일 만에 중단됐는데, 당초 목표였던 기업가치 최대 1,500억달러·조달액 150억달러가 사라지면서 증설 재원 마련 방식이 다시 숙제가 됐습니다. 엔비디아 루빈 플랫폼 출시가 늦어지면 HBM4 출하량이 기대에 못 미칠 수 있고, 삼성전자의 HBM4 수율 개선으로 내년 점유율 경쟁이 치열해질 전망입니다. 원/달러 환율이 1,320원대로 내려온 점은 달러로 파는 메모리 업체의 4분기 원화 환산 이익에 부담이 됩니다. 빅테크가 AI 투자 수익화 압박에 데이터센터 투자를 조정하면 메모리 주문도 흔들릴 수 있다는 점이 가장 큰 꼬리 위험으로 꼽힙니다.","head":"리스크 점검: 솔리다임 상장 중단 후폭풍, HBM4 출하 지연 가능성, 원화 강세","source":{"name":"이슈온 · 서울경제TV","url":"https://www.issueon.co.kr/news/articleView.html?idxno=14209"}}],"tag":"000660","title":"SK하이닉스"}],"summary":"앤트로픽이 브로드컴 AI 반도체를 빌려 쓰기 위한 630억달러 자금 조달에 나섰다는 소식에 간밤 필라델피아 반도체지수가 3.6% 급등했고, 유가가 100달러 아래로 내려오며 뉴욕증시 3대 지수가 이틀 연속 올랐습니다. 어제 코스피는 3.09% 급등한 5,638선에서 마감했고 SK하이닉스는 5.18% 오른 134만1천원으로 9거래일 만에 130만원대를 되찾았습니다. 오늘 오전 SK하이닉스 3분기 실적(영업이익 컨센서스 약 77조원)과 추가 주주환원안이 공개되고, 한국시간 29일 새벽 FOMC 금리 결정, 29일 삼성전자 확정 실적이 이어집니다.","terms":{"루빈":"엔비디아가 내놓는 차세대 AI 가속기 플랫폼 이름. HBM4를 처음 대량으로 쓰는 제품입니다.","밸류에이션":"이익·자산 대비 주가가 얼마나 비싼지 따지는 평가. PER·PBR 같은 지표로 봅니다.","비트 출하량":"메모리를 개수가 아니라 저장 용량(비트) 기준으로 센 출하량. 가격과 함께 메모리 매출을 결정하는 두 축입니다.","소비자신뢰지수":"미국 콘퍼런스보드가 매달 발표하는 소비 심리 지표. 높을수록 소비자가 경기를 낙관한다는 뜻입니다.","솔리다임":"SK하이닉스가 인텔 낸드 사업을 인수해 만든 미국 SSD 자회사. 최근 상장 추진을 중단했습니다.","수율":"웨이퍼에서 만든 칩 가운데 정상 제품의 비율. 수율이 오르면 같은 설비로 더 많이, 더 싸게 만들 수 있습니다.","잉여현금흐름":"영업으로 번 현금에서 설비투자를 빼고 남는 돈. 배당이나 자사주 매입의 실제 재원입니다.","장기공급계약":"고객사가 몇 년치 물량을 미리 약속하고 사가는 계약(LTA). 공급사는 매출 가시성을, 고객은 물량 확보를 얻습니다. 요즘은 10년짜리 요구까지 나옵니다.","콘퍼런스콜":"실적 발표 뒤 경영진이 애널리스트·투자자와 전화로 질의응답하는 자리. 향후 전망 발언이 주가를 움직입니다.","페드워치":"시카고상품거래소(CME)가 선물 가격으로 계산하는 연준 금리 결정 확률 지표입니다.","현물가격":"그때그때 소량으로 거래되는 메모리 가격. 대형 고객과 맺는 계약가격보다 먼저 움직여 선행 지표로 봅니다.","회사채":"기업이 돈을 빌리기 위해 발행하는 채권. 신용등급이 높을수록 이자율이 낮고, 발행이 늘면 그만큼 투자가 활발하다는 신호입니다."},"ticker":[{"chg":"+3.09%","name":"코스피","value":"5,638.34"},{"chg":"+2.29%","name":"코스닥","value":"743.83"},{"chg":"+5.18%","name":"SK하이닉스","value":"1,341,000원"},{"chg":"+4.23%","name":"삼성전자","value":"222,000원"},{"chg":"+3.60%","name":"필라델피아 반도체","value":"11,482.51"},{"chg":"+1.18%","name":"나스닥","value":"26,477.81"},{"chg":"-0.02%p","name":"美 10년물 금리","value":"약 4.98%"},{"chg":"-1.83%","name":"WTI 유가","value":"$99.90"}]}]/*__END__*/;
